name: iOS Build

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest available Xcode
        run: |
          echo "Installed Xcode versions on this runner:"
          ls /Applications | grep -i '^Xcode' || true
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST" ]; then
            echo "Selecting $LATEST"
            sudo xcode-select -s "$LATEST/Contents/Developer"
          else
            echo "No versioned Xcode_*.app found, keeping the current default."
          fi
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an available iPad simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -o 'iPad[^(]*' | head -n 1 | sed 's/[[:space:]]*$//')
          if [ -z "$NAME" ]; then
            echo "No iPad simulator found, falling back to any available iPhone simulator"
            NAME=$(xcrun simctl list devices available | grep -o 'iPhone[^(]*' | head -n 1 | sed 's/[[:space:]]*$//')
          fi
          echo "Using simulator: $NAME"
          echo "device_name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build for simulator
        id: build
        run: |
          set -o pipefail
          xcodebuild build \
            -project SimLife.xcodeproj \
            -scheme SimLife \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device_name }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator and capture a screenshot
        if: steps.build.outcome == 'success'
        run: |
          set -e
          DEVICE_ID=$(xcrun simctl list devices available | grep "${{ steps.sim.outputs.device_name }}" | head -n 1 | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "SimLife.app" -path "*iphonesimulator*" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not locate built SimLife.app under DerivedData"
            exit 1
          fi
          echo "Installing $APP_PATH"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.simlife.app.SimLife
          sleep 3
          mkdir -p ../ci-artifacts
          xcrun simctl io "$DEVICE_ID" screenshot ../ci-artifacts/simlife-screenshot.png

      - name: Upload screenshot
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: simlife-simulator-screenshot
          path: ci-artifacts/simlife-screenshot.png
          if-no-files-found: warn
