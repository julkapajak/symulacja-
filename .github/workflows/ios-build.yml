name: iOS Build

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest available Xcode
        run: |
          echo "Installed Xcode versions on this runner:"
          ls /Applications | grep -i '^Xcode' || true
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST" ]; then
            echo "Selecting $LATEST"
            sudo xcode-select -s "$LATEST/Contents/Developer"
          else
            echo "No versioned Xcode_*.app found, keeping the current default."
          fi
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen version

      - name: Generate Xcode project
        run: xcodegen generate

      # Building against a generic simulator destination avoids ever having to
      # match an exact device name/runtime string, which is brittle (device
      # lists vary by runner image and change over time).
      - name: Build for simulator
        id: build
        run: |
          set -o pipefail
          xcodebuild build \
            -project SimLife.xcodeproj \
            -scheme SimLife \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      # Only for taking a screenshot do we need one concrete, bootable device.
      # Parsed from `simctl ... -j` (JSON) instead of grepping human-readable
      # text, so this doesn't depend on exact device-name formatting either.
      - name: Pick a concrete iPad simulator to boot
        if: steps.build.outcome == 'success'
        id: sim
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess

          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"]
          ))

          def pick(predicate):
              for devices in data["devices"].values():
                  for d in devices:
                      if d.get("isAvailable") and predicate(d):
                          return d
              return None

          device = pick(lambda d: "iPad" in d.get("name", "")) or pick(lambda d: True)

          if device is None:
              raise SystemExit("No available simulator devices found at all.")

          print(f"Using simulator: {device['name']} ({device['udid']})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"device_udid={device['udid']}\n")
              f.write(f"device_name={device['name']}\n")
          PYEOF

      - name: Boot simulator and capture a screenshot
        if: steps.build.outcome == 'success'
        run: |
          set -e
          DEVICE_ID="${{ steps.sim.outputs.device_udid }}"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "SimLife.app" -path "*iphonesimulator*" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not locate built SimLife.app under DerivedData"
            exit 1
          fi
          echo "Installing $APP_PATH"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.simlife.app.SimLife
          sleep 3
          mkdir -p ../ci-artifacts
          xcrun simctl io "$DEVICE_ID" screenshot ../ci-artifacts/simlife-screenshot.png

      - name: Upload screenshot
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: simlife-simulator-screenshot
          path: ci-artifacts/simlife-screenshot.png
          if-no-files-found: warn
