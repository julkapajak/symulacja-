<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SimLife — gra w stylu The Sims</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="gameArea">
  <canvas id="canvas"></canvas>
  <div id="actionPanel" class="hidden"></div>
  <div id="shopPanel" class="hidden"></div>
  <div id="toastContainer"></div>
</div>

<div id="topbar">
  <div class="topbar-group">
    <span id="simName">—</span>
    <span id="mood" class="mood">😐</span>
  </div>
  <div class="topbar-group">
    <span id="clock">Dzień 1, 08:00</span>
    <div id="speedControls">
      <button data-speed="0" title="Pauza">⏸</button>
      <button data-speed="1" class="active" title="Normalna prędkość">▶</button>
      <button data-speed="2" title="2x">⏩</button>
      <button data-speed="3" title="3x">⏩⏩</button>
    </div>
  </div>
  <div class="topbar-group">
    <div id="zoomControls">
      <button id="zoomOutBtn" title="Oddal">➖</button>
      <button id="zoomResetBtn" title="Resetuj widok">⛶</button>
      <button id="zoomInBtn" title="Przybliż">➕</button>
    </div>
  </div>
  <div class="topbar-group">
    <span id="money">💰 0 zł</span>
    <button id="buildBtn" title="Tryb budowania">🔨</button>
    <button id="saveBtn" title="Zapisz grę">💾</button>
    <button id="newGameBtn" title="Nowa gra">🆕</button>
  </div>
</div>

<div id="bottomHud">
  <div id="needsPanel" class="hudCard">
    <div class="hudCardTitle">Potrzeby</div>
    <div class="need" data-need="hunger">
      <span class="need-icon">🍗</span>
      <div class="need-bar"><div class="need-fill"></div></div>
    </div>
    <div class="need" data-need="energy">
      <span class="need-icon">⚡</span>
      <div class="need-bar"><div class="need-fill"></div></div>
    </div>
    <div class="need" data-need="hygiene">
      <span class="need-icon">🧼</span>
      <div class="need-bar"><div class="need-fill"></div></div>
    </div>
    <div class="need" data-need="fun">
      <span class="need-icon">🎉</span>
      <div class="need-bar"><div class="need-fill"></div></div>
    </div>
    <div class="need" data-need="social">
      <span class="need-icon">💬</span>
      <div class="need-bar"><div class="need-fill"></div></div>
    </div>
    <div class="need" data-need="bladder">
      <span class="need-icon">🚻</span>
      <div class="need-bar"><div class="need-fill"></div></div>
    </div>
  </div>

  <div id="careerPanel" class="hudCard">
    <div class="hudCardTitle" id="jobTitle">💼 Stażysta</div>
    <div class="skill" data-skill="cooking">
      <span class="skill-icon">🍳</span>
      <div class="skill-bar"><div class="skill-fill"></div></div>
      <span class="skill-level">0/10</span>
    </div>
    <div class="skill" data-skill="fitness">
      <span class="skill-icon">💪</span>
      <div class="skill-bar"><div class="skill-fill"></div></div>
      <span class="skill-level">0/10</span>
    </div>
    <div class="skill" data-skill="charisma">
      <span class="skill-icon">🗣️</span>
      <div class="skill-bar"><div class="skill-fill"></div></div>
      <span class="skill-level">0/10</span>
    </div>
  </div>

  <div id="aspirationPanel" class="hudCard">
    <span id="aspirationIcon">🎯</span>
    <div class="hudCardTitle" id="aspirationName">—</div>
    <div class="need-bar" id="aspirationBarWrap"><div id="aspirationFill" class="need-fill"></div></div>
    <span id="aspirationProgress" class="skill-level">0/10</span>
  </div>

  <div id="partnerPanel" class="hudCard hidden">
    <div class="hudCardTitle"><span id="partnerName">—</span> <span id="partnerMood">😐</span></div>
    <div class="need" data-pneed="hunger"><span class="need-icon">🍗</span><div class="need-bar"><div class="need-fill"></div></div></div>
    <div class="need" data-pneed="energy"><span class="need-icon">⚡</span><div class="need-bar"><div class="need-fill"></div></div></div>
    <div class="need" data-pneed="fun"><span class="need-icon">🎉</span><div class="need-bar"><div class="need-fill"></div></div></div>
    <div class="relBar">
      <span class="relIcon">💗</span>
      <div class="need-bar"><div id="relFill" class="need-fill"></div></div>
      <span id="relLabel">Znajomi</span>
    </div>
  </div>
</div>

<div id="charCreator" class="modalOverlay">
  <div class="modal">
    <h2>Stwórz swojego Sima</h2>
    <label>Imię
      <input id="ccName" type="text" maxlength="16" placeholder="np. Alex" />
    </label>
    <div class="ccRow">
      <span>Kolor</span>
      <div id="ccColors" class="swatches"></div>
    </div>
    <div class="ccRow">
      <span>Cecha charakteru</span>
      <div id="ccTraits" class="traits"></div>
    </div>
    <div class="ccRow">
      <span>Cel życiowy</span>
      <div id="ccAspirations" class="traits"></div>
    </div>
    <button id="ccConfirm">Dalej</button>
  </div>
</div>

<div id="partnerCreator" class="modalOverlay hidden">
  <div class="modal">
    <h2>Współlokator?</h2>
    <p class="modalHint">Możesz zamieszkać z kimś — będzie żył swoim życiem obok Ciebie.</p>
    <label>Imię
      <input id="pcName" type="text" maxlength="16" placeholder="np. Robin" />
    </label>
    <div class="ccRow">
      <span>Kolor</span>
      <div id="pcColors" class="swatches"></div>
    </div>
    <button id="pcConfirm">Dodaj współlokatora</button>
    <button id="pcSkip" class="secondaryBtn">Zamieszkam sam/sama</button>
  </div>
</div>

<div id="itemPicker" class="modalOverlay hidden">
  <div class="modal wide">
    <h2>Postaw mebel</h2>
    <div id="itemPickerGrid" class="itemGrid"></div>
    <button id="itemPickerClose" class="secondaryBtn">Zamknij</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
